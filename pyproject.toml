[project]
name = "kopitiam"
version = "0.1.0"
description = "本地聊天室：多个 coding agent 与用户互发消息和文件"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "mcp<2",
    "psutil>=7.2.2",
]

[project.scripts]
kopitiam = "kopitiam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kopitiam"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

